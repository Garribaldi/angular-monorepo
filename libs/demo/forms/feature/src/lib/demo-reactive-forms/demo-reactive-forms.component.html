<div *ngIf="(requests$ | async) as requests" class="form">

  <form [formGroup]="testForm" (ngSubmit)="onSubmit()" cyGet="reactive-form">
    <forms-input-control
      [formControl]="testForm.controls['firstName']"
      [requiredErrorMessage]="'Please enter your first name.'" cyGet="reactive-form-name">First Name
    </forms-input-control>

    <forms-input-control
      [formControl]="testForm.controls['lastName']"
      [requiredErrorMessage]="'Please enter your last name.'" cyGet="reactive-form-last-name">Last Name
    </forms-input-control>

    <forms-email-control [formControl]="testForm.controls['email']" cyGet="reactive-form-email" />

    <forms-password-control [formControl]="testForm.controls['password']" cyGet="reactive-form-password" />

    <forms-select-control
      [formControl]="testForm.controls['city']" [selectOptions]="requests.cities"
      [requiredErrorMessage]="'Please choose a city.'" cyGet="reactive-form-cities">City
    </forms-select-control>

    <forms-select-control
      [formControl]="testForm.controls['country']"
      [selectOptions]="requests.countries"
      [requiredErrorMessage]="'Please choose a country.'" cyGet="reactive-form-countries">Country
    </forms-select-control>

    <button mat-flat-button color="primary" type="submit" [disabled]="!testForm.valid" cyGet="reactive-form-submit">
      Send
    </button>

    <pre class="mt-8">Model: {{ testForm.value | json }}</pre>
  </form>

</div>
